<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算思维课程助手系统</title>
    
    <!-- 引入 CSS（相当于 Qt 的 QSS）-->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🎓 计算思维课程助手系统</h1>
            <p>基于大语言模型的智能教学辅助平台 v1.0.0</p>
        </div>
        
        <!-- 主体内容 -->
        <div class="content">
            <!-- 系统测试区域 -->
            <div class="test-section">
                <h2>🔧 系统测试</h2>
                <p>点击按钮测试后端连接和 OpenAI API 配置：</p>
                <button id="testBtn">测试系统状态</button>
                <div class="result" id="testResult"></div>
            </div>
            
            <!-- AI 聊天区域 -->
            <div class="test-section">
                <h2>💬 AI 智能对话</h2>
                <p>与 AI 助手交流，获取编程学习帮助：</p>
                
                <div class="chat-container">
                    <div class="chat-messages" id="chatMessages">
                        <div class="message bot">
                            <div class="message-content">
                                你好！我是计算思维课程助手，可以帮你：<br>
                                • 解答 C 语言编程问题<br>
                                • 分析代码错误<br>
                                • 讲解数据结构和算法<br>
                                有什么可以帮你的吗？
                            </div>
                        </div>
                    </div>
                    
                    <div class="chat-input-area">
                        <input 
                            type="text" 
                            id="messageInput" 
                            placeholder="输入你的问题，按回车发送..."
                        >
                        <button id="sendBtn">发送</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 状态栏 -->
        <div class="status-bar">
            <span class="status-indicator"></span>
            系统运行中 | Powered by OpenAI GPT
        </div>
    </div>

    <!-- 引入 JavaScript（注意顺序！）-->
    <script src="{{ url_for('static', filename='js/config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/models/ChatModel.js') }}"></script>
    <script src="{{ url_for('static', filename='js/views/ChatView.js') }}"></script>
    <script src="{{ url_for('static', filename='js/controllers/ChatController.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
